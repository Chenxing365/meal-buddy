# =================================================================
# application-prod.yml — 局域网生产环境配置
#
# 覆盖 application.yml 中的公共配置；敏感项全部通过环境变量注入
# （由 /opt/meal-buddy/app/meal-buddy.env 提供，systemd EnvironmentFile 加载）
#
# 注意：Maven 资源过滤使用 @ 分隔符，此处的 ${} 占位符不会被替换。
# =================================================================

spring:

  # ── MongoDB（Docker 容器，仅监听 127.0.0.1）────────────────
  data:
    mongodb:
      host: ${MONGO_HOST:127.0.0.1}
      port: ${MONGO_PORT:27017}
      database: distributed_base
      username: ${MONGO_USER:app_user}
      password: ${MONGO_PASSWORD:CHANGE_ME_mongo_app_password}
      authentication-database: ${MONGO_AUTH_DB:distributed_base}

    # ── Redis ────────────────────────────────────────────────
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

# ── 服务端口（双实例分别以 SERVER_PORT=8080/8081 注入）────────
server:
  port: ${SERVER_PORT:8080}

# ── 安全：密钥从环境变量注入，避免明文入库 ────────────────────
security:
  jwt:
    # HS256 要求密钥不少于 32 字节，占位值长度已满足
    secret: ${JWT_SECRET:CHANGE_ME_jwt_secret_at_least_32_chars_long}
    access-token-expiration: 7200000
    refresh-token-expiration: 604800000
  aes:
    # 实现取前 16 字节作为 AES-128 密钥，占位值仅用于提示必须覆盖
    key: ${AES_KEY:CHANGE_ME_aes_16b}

# ── 生产日志：文件 + 控制台，由 systemd 收集到 journal ────────
logging:
  level:
    root: INFO
    com.distributed: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.data.redis: WARN
    org.apache.cxf: WARN
  file:
    name: ${LOG_DIR:/opt/meal-buddy/logs}/meal-buddy-${SERVER_PORT:8080}.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14

# ── Swagger 在生产保留只读文档，便于内网联调 ─────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
