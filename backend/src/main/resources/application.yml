# ============================================================
# application.yml —— 生产/公共基础配置
# 敏感的本地差异配置（IP、端口）放在 application-dev.yml
# ============================================================

spring:
  application:
    name: distributed-base

  # 激活的环境 Profile（由 Maven Profile 或启动参数注入）
  profiles:
    active: "@spring.profiles.active@"

  # ── Jackson 全局序列化 ──────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # ── MongoDB 公共配置（生产环境覆盖 host/port）───────────────
  data:
    mongodb:
      database: distributed_base
      auto-index-creation: true            # 自动创建 @Indexed 声明的索引

    # ── Redis 公共配置 ─────────────────────────────────────────
    redis:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

  # ── Spring AI 基础配置 ────────────────────────────────────────
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:mock-key-placeholder}
      chat:
        options:
          model: ${AI_MODEL_NAME:deepseek-flash}
          temperature: 0.7

# ── 服务器 ────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000

# ── Apache CXF WebService ─────────────────────────────────────
cxf:
  path: /ws                                # SOAP 端点根路径：http://host:8080/ws
  servlet:
    load-on-startup: 1

# ── SpringDoc / Swagger UI ────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# ── 日志 ─────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.distributed: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.apache.cxf: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── 安全与鉴权配置（M1 用户域）───────────────────────────
security:
  jwt:
    secret: MealBuddySecretKeyForJwtAuthenticationTokenSigning20261027
    access-token-expiration: 7200000       # 2 小时
    refresh-token-expiration: 604800000   # 7 天
  aes:
    key: MealBuddyAesKey!                  # 16 字节 AES-128 密钥


# ── AI 智能体引擎配置（M3 AI 推荐域）─────────────────────────
meal-buddy:
  agent:
    engine: spring-ai                      # 首期启用 spring-ai，支持切换为 langchain4j

  # ── DIY 检索层（TreeRAG 主链 + Naive 叶子 + Era 增量 + Graph 旁路）──
  retrieval:
    tree:
      enabled: true
      max-depth: 3                         # 1=会话 2=话题 3=消息
      top-nodes: 3
      leaf-top-k: 5
      session-window-days: 7
      topic-turn-size: 6
    leaf:
      enabled: true
      top-k: 5
      min-score: 0.05
    era:
      enabled: true
      min-corpus: 2000                     # 语料低于该规模只做增量，不触发全量重建
      change-threshold: 200
      change-ratio: 0.2
      refresh-interval-ms: 300000
    graph:
      enabled: false                       # GraphRAG 旁路默认关闭，按需开启


